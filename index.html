<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Cobrinha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #151515;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        #jogo {
            position: fixed;
            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            display: block;
        }

        .interface {
            position: fixed;
            z-index: 10;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            text-align: center;

            pointer-events: none;

            white-space: nowrap;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 8px;

            color: #4ade80;

            text-shadow:
                0 0 10px rgba(74, 222, 128, 0.35);
        }

        .pontuacao {
            font-size: 20px;
        }

        #pontos {
            color: #4ade80;
            font-weight: bold;
        }

        #mensagem {
            margin-top: 8px;
            font-size: 16px;
            color: #dddddd;
        }
    </style>
</head>

<body>

    <div class="interface">

        <h1>Jogo da Cobrinha</h1>

        <div class="pontuacao">
            Pontuação:
            <span id="pontos">0</span>
        </div>

        <div id="mensagem">
            Use as setas ou WASD para começar.
        </div>

    </div>

    <canvas id="jogo"></canvas>


    <script>

        // ==========================================
        // CONFIGURAÇÃO
        // ==========================================

        const canvas = document.getElementById("jogo");
        const ctx = canvas.getContext("2d");

        const pontosTexto = document.getElementById("pontos");
        const mensagem = document.getElementById("mensagem");

        const TAMANHO = 20;

        let cobra = [];

        let comida = {
            x: 0,
            y: 0
        };

        let direcao = "direita";
        let proximaDirecao = "direita";

        let pontos = 0;

        let jogoAtivo = true;
        let jogoComecou = false;

        let ultimoMovimento = 0;

        const velocidade = 110;


        // ==========================================
        // AJUSTAR TELA
        // ==========================================

        function ajustarTela() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        }


        // ==========================================
        // CRIAR COBRA
        // ==========================================

        function criarCobra() {

            const centroX =
                Math.floor(
                    (canvas.width / 2) / TAMANHO
                ) * TAMANHO;

            const centroY =
                Math.floor(
                    (canvas.height / 2) / TAMANHO
                ) * TAMANHO;


            cobra = [

                {
                    x: centroX,
                    y: centroY
                },

                {
                    x: centroX - TAMANHO,
                    y: centroY
                },

                {
                    x: centroX - TAMANHO * 2,
                    y: centroY
                }

            ];

        }


        // ==========================================
        // CRIAR COMIDA
        // ==========================================

        function criarComida() {

            const colunas =
                Math.floor(canvas.width / TAMANHO);

            const linhas =
                Math.floor(canvas.height / TAMANHO);


            let novaComida;


            do {

                novaComida = {

                    x:
                        Math.floor(
                            Math.random() * colunas
                        ) * TAMANHO,

                    y:
                        Math.floor(
                            Math.random() * linhas
                        ) * TAMANHO

                };

            }

            while (
                cobra.some(
                    parte =>
                        parte.x === novaComida.x &&
                        parte.y === novaComida.y
                )
            );


            comida = novaComida;

        }


        // ==========================================
        // CONTROLES
        // ==========================================

        document.addEventListener(
            "keydown",
            function (event) {

                const tecla =
                    event.key.toLowerCase();


                if (!jogoAtivo) {
                    return;
                }


                if (
                    (tecla === "arrowup" || tecla === "w") &&
                    direcao !== "baixo"
                ) {

                    proximaDirecao = "cima";

                    jogoComecou = true;

                }


                else if (
                    (tecla === "arrowdown" || tecla === "s") &&
                    direcao !== "cima"
                ) {

                    proximaDirecao = "baixo";

                    jogoComecou = true;

                }


                else if (
                    (tecla === "arrowleft" || tecla === "a") &&
                    direcao !== "direita"
                ) {

                    proximaDirecao = "esquerda";

                    jogoComecou = true;

                }


                else if (
                    (tecla === "arrowright" || tecla === "d") &&
                    direcao !== "esquerda"
                ) {

                    proximaDirecao = "direita";

                    jogoComecou = true;

                }

            }
        );


        // ==========================================
        // ATUALIZAR JOGO
        // ==========================================

        function atualizar() {

            if (!jogoAtivo || !jogoComecou) {
                return;
            }


            direcao = proximaDirecao;


            let novaCabeca = {

                x: cobra[0].x,

                y: cobra[0].y

            };


            if (direcao === "cima") {

                novaCabeca.y -= TAMANHO;

            }


            if (direcao === "baixo") {

                novaCabeca.y += TAMANHO;

            }


            if (direcao === "esquerda") {

                novaCabeca.x -= TAMANHO;

            }


            if (direcao === "direita") {

                novaCabeca.x += TAMANHO;

            }


            // ======================================
            // BATEU NA PAREDE
            // ======================================

            if (
                novaCabeca.x < 0 ||
                novaCabeca.y < 0 ||
                novaCabeca.x >= canvas.width ||
                novaCabeca.y >= canvas.height
            ) {

                perder();

                return;

            }


            // ======================================
            // BATEU NO PRÓPRIO CORPO
            // ======================================

            for (let i = 0; i < cobra.length; i++) {

                if (
                    novaCabeca.x === cobra[i].x &&
                    novaCabeca.y === cobra[i].y
                ) {

                    perder();

                    return;

                }

            }


            // Adiciona a nova cabeça

            cobra.unshift(novaCabeca);


            // ======================================
            // COMEU A COMIDA
            // ======================================

            if (
                novaCabeca.x === comida.x &&
                novaCabeca.y === comida.y
            ) {

                pontos++;

                pontosTexto.textContent =
                    pontos;

                criarComida();

            }

            else {

                cobra.pop();

            }

        }


        // ==========================================
        // DESENHAR FUNDO
        // ==========================================

        function desenharFundo() {

            ctx.fillStyle = "#151515";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Grade

            ctx.strokeStyle =
                "rgba(255,255,255,0.035)";

            ctx.lineWidth = 1;


            for (
                let x = 0;
                x < canvas.width;
                x += TAMANHO
            ) {

                ctx.beginPath();

                ctx.moveTo(x, 0);

                ctx.lineTo(
                    x,
                    canvas.height
                );

                ctx.stroke();

            }


            for (
                let y = 0;
                y < canvas.height;
                y += TAMANHO
            ) {

                ctx.beginPath();

                ctx.moveTo(0, y);

                ctx.lineTo(
                    canvas.width,
                    y
                );

                ctx.stroke();

            }

        }


        // ==========================================
        // DESENHAR COMIDA
        // ==========================================

        function desenharComida() {

            const x =
                comida.x + TAMANHO / 2;

            const y =
                comida.y + TAMANHO / 2;


            // Brilho

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                11,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "rgba(255, 59, 48, 0.20)";

            ctx.fill();


            // Comida

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "#ff3b30";

            ctx.fill();

        }


        // ==========================================
        // DESENHAR COBRA
        // ==========================================

        function desenharCobra() {

            for (
                let i = 0;
                i < cobra.length;
                i++
            ) {

                const parte = cobra[i];

                const margem = 2;


                ctx.beginPath();

                ctx.roundRect(
                    parte.x + margem,
                    parte.y + margem,
                    TAMANHO - margem * 2,
                    TAMANHO - margem * 2,
                    7
                );


                if (i === 0) {

                    ctx.fillStyle = "#70ff91";

                }

                else {

                    ctx.fillStyle = "#32c759";

                }


                ctx.fill();

            }

        }


        // ==========================================
        // DESENHAR TUDO
        // ==========================================

        function desenhar() {

            desenharFundo();

            desenharComida();

            desenharCobra();

        }


        // ==========================================
        // PERDEU
        // ==========================================

        function perder() {

            jogoAtivo = false;


            mensagem.textContent =
                "FIM DE JOGO! Pontuação: " + pontos;


            mensagem.style.color = "#ff4d4d";


            // O jogo termina aqui.
            // Não existe botão de reiniciar.

        }


        // ==========================================
        // LOOP
        // ==========================================

        function loop(tempo) {

            if (
                tempo - ultimoMovimento >= velocidade
            ) {

                atualizar();

                ultimoMovimento = tempo;

            }


            desenhar();


            requestAnimationFrame(loop);

        }


        // ==========================================
        // INICIAR
        // ==========================================

        ajustarTela();

        criarCobra();

        criarComida();

        desenhar();

        requestAnimationFrame(loop);


        // Ajusta quando mudar o tamanho da janela

        window.addEventListener(
            "resize",
            function () {

                if (!jogoAtivo) {
                    return;
                }

                ajustarTela();

            }
        );

    </script>

</body>

</html>
