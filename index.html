<body>

    <div class="container">

        <h1>Jogo da Cobrinha</h1>

        <p>Pontuação: <span id="pontos">0</span></p>

        <p id="mensagem">
            Use as setas ou WASD para começar.
        </p>

        <canvas id="jogo" width="400" height="400"></canvas>

        <div class="controles">
            <button id="cima">▲</button>
            <button id="esquerda">◀</button>
            <button id="baixo">▼</button>
            <button id="direita">▶</button>
        </div>

        <button id="reiniciar" type="button" hidden>
            Jogar novamente
        </button>

        <p>
            Pegue as facas e não bata nas paredes nem em você mesmo.
        </p>

    </div>

    <script src="script.js"></script>

</body>
